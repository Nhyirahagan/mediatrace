[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediatrace"
version = "0.1.0"
description = "Smart file organizer with content-based file type detection, plus one clean API to download media from YouTube, TikTok, Instagram, X and 1,000+ sites, with metadata stripped and safe filenames."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nhyirahagan" }]
keywords = ["file-organizer", "mime", "magic-bytes", "media-downloader", "yt-dlp", "metadata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: System :: Filesystems",
    "Topic :: Multimedia",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nhyirahagan/mediatrace"
Issues = "https://github.com/Nhyirahagan/mediatrace/issues"
Changelog = "https://github.com/Nhyirahagan/mediatrace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
media = ["yt-dlp>=2024.1.0"]
images = ["Pillow>=10.0"]
magic = ["python-magic>=0.4.27"]
all = ["yt-dlp>=2024.1.0", "Pillow>=10.0"]
dev = ["pytest>=8.0", "Pillow>=10.0"]

[project.scripts]
mediatrace = "mediatrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediatrace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
